<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>Sudoku</title>
<style>
:root{
  --bg:#f6f5f1; --fg:#1d1d1f; --muted:#7a7a80; --panel:#ffffff;
  --line:#c9c7c0; --line-strong:#1d1d1f;
  --sel:#bcd7ff; --peer:#e9eef7; --same:#d3e3fb;
  --user:#1f5fd6; --given:#1d1d1f; --err:#d12b2b; --err-bg:#fde0e0;
  --btn:#ebe9e3; --btn-fg:#1d1d1f; --accent:#1f5fd6; --ok:#1b8a4b;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16171a; --fg:#ececf0; --muted:#8d8d96; --panel:#1f2024;
    --line:#3a3b42; --line-strong:#ececf0;
    --sel:#2b4a80; --peer:#25272e; --same:#2f3f5e;
    --user:#6fa3ff; --given:#ececf0; --err:#ff6b6b; --err-bg:#4a2326;
    --btn:#2a2b31; --btn-fg:#ececf0; --accent:#6fa3ff; --ok:#4cc27d;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:manipulation;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
body{display:flex;justify-content:center;align-items:flex-start;
  padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom))}
main{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.levels{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:var(--btn-fg);background:var(--btn);border:0;border-radius:8px;
  padding:8px 12px;cursor:pointer;min-height:40px}
button:active{filter:brightness(.92)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lv[aria-pressed=true]{background:var(--accent);color:#fff}
#timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:1.05rem}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
#mode[aria-pressed=true]{background:var(--accent);color:#fff}
#status{min-height:1.4em;text-align:center;font-size:.95rem;color:var(--muted)}
#status.bad{color:var(--err)} #status.good{color:var(--ok);font-weight:600}
#grid{--s:min(calc(100vw - 32px),58vh,520px);width:var(--s);height:var(--s);align-self:center;
  display:grid;grid-template:repeat(9,1fr)/repeat(9,1fr);
  border:2px solid var(--line-strong);background:var(--panel);border-radius:4px;overflow:hidden}
.c{display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--s)/16);border:1px solid var(--line);cursor:pointer;position:relative}
.c:nth-child(9n+3),.c:nth-child(9n+6){border-right:2px solid var(--line-strong)}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--line-strong)}
.c:nth-child(9n){border-right-width:1px}
.c.peer{background:var(--peer)}
.c.same{background:var(--same)}
.c.sel{background:var(--sel)}
.c.given{color:var(--given);font-weight:600}
.c.user{color:var(--user)}
.c.hint{color:var(--ok)}
.c.err{color:var(--err);background:var(--err-bg)}
.c.sel.err{background:var(--err-bg);box-shadow:inset 0 0 0 2px var(--err)}
#pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
#pad button{padding:0;min-height:52px;font-size:1.3rem;font-weight:600;position:relative}
#pad button small{position:absolute;right:5px;bottom:2px;font-size:.6rem;font-weight:400;color:var(--muted)}
#pad button.done{opacity:.3}
#acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#help{font-size:.78rem;color:var(--muted);text-align:center;line-height:1.5}
@media (hover:none){#help{display:none}}
kbd{background:var(--btn);border-radius:4px;padding:0 5px;font:inherit}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
#win.show{display:flex}
#win div{background:var(--panel);border-radius:14px;padding:24px;text-align:center;max-width:320px;width:100%}
#win h2{margin:0 0 6px} #win p{margin:0 0 16px;color:var(--muted)}
@media (max-height:700px){#pad button{min-height:44px}}
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="levels" id="levels" role="group" aria-label="Difficulty"></div>
    <div id="timer" aria-live="off">0:00</div>
  </div>
  <div class="bar2">
    <button id="mode" aria-pressed="true" title="Toggle instant check (C)">Instant check: on</button>
    <button id="new" title="New game (N)">New game</button>
  </div>
  <div id="grid" role="grid" aria-label="Sudoku board"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="pad"></div>
  <div id="acts">
    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="hint">Hint</button>
    <button id="erase">Erase</button>
  </div>
  <div id="help">
    <kbd>←↑↓→</kbd>/<kbd>WASD</kbd>/<kbd>HJKL</kbd> move · <kbd>1-9</kbd> place · <kbd>0</kbd>/<kbd>⌫</kbd> erase ·
    <kbd>Ctrl+Z</kbd>/<kbd>Ctrl+Y</kbd> undo/redo<br>
    <kbd>?</kbd>/<kbd>Shift+H</kbd> hint · <kbd>C</kbd> toggle check mode · <kbd>Shift+D</kbd> difficulty · <kbd>N</kbd> new game
  </div>
</main>
<div id="win"><div><h2>Solved!</h2><p id="winmsg"></p><button id="again">Play again</button></div></div>

<script>
"use strict";
const LEVELS = [
  {name:"Easy",   clues:40},
  {name:"Medium", clues:33},
  {name:"Hard",   clues:28},
  {name:"Expert", clues:24},
];
const SAVE_KEY = "sudoku.v1", PREF_KEY = "sudoku.prefs.v1";

// ---------- solver / generator ----------
const ROW = i => (i/9)|0, COL = i => i%9, BOX = i => ((ROW(i)/3)|0)*3 + ((COL(i)/3)|0);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

// Counts solutions up to `limit`. If randomize, tries digits in random order. Stores first solution in out.
function solve(grid, limit, randomize, out){
  const g = grid.slice(), r = new Array(9).fill(0), c = new Array(9).fill(0), b = new Array(9).fill(0);
  for(let i=0;i<81;i++) if(g[i]){ const m=1<<g[i]; r[ROW(i)]|=m; c[COL(i)]|=m; b[BOX(i)]|=m; }
  let count = 0;
  (function rec(){
    let best=-1, bestMask=0, bestN=10;
    for(let i=0;i<81;i++){
      if(g[i]) continue;
      const mask = ~(r[ROW(i)]|c[COL(i)]|b[BOX(i)]) & 0x3fe;
      let n=0; for(let m=mask;m;m&=m-1) n++;
      if(n<bestN){ best=i; bestMask=mask; bestN=n; if(n<=1) break; }
    }
    if(best<0){ if(count===0 && out) for(let i=0;i<81;i++) out[i]=g[i]; count++; return; }
    if(bestN===0) return;
    const ds=[]; for(let d=1;d<=9;d++) if(bestMask&(1<<d)) ds.push(d);
    if(randomize) shuffle(ds);
    for(const d of ds){
      const m=1<<d, R=ROW(best), C=COL(best), B=BOX(best);
      g[best]=d; r[R]|=m; c[C]|=m; b[B]|=m;
      rec();
      g[best]=0; r[R]&=~m; c[C]&=~m; b[B]&=~m;
      if(count>=limit) return;
    }
  })();
  return count;
}

function generate(clues){
  const sol = new Array(81).fill(0);
  solve(sol.slice(), 1, true, sol);
  const puz = sol.slice();
  let left = 81;
  for(const i of shuffle([...Array(81).keys()])){
    if(left<=clues) break;
    const j = 80-i; // 180° symmetry
    if(!puz[i]) continue;
    const a=puz[i], bb=puz[j];
    puz[i]=0; puz[j]=0;
    if(solve(puz,2,false)!==1){ puz[i]=a; puz[j]=bb; }
    else left -= (i===j?1:2);
  }
  return {puz, sol};
}

// ---------- state ----------
let G = null; // {level, given[], val[], sol[], hint[], time, hints, moves, won}
let sel = 40, undoS = [], redoS = [], timerId = null, lastTick = 0, confirmNew = 0;
let prefs = {level:1, instant:true};
try{ Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY)||"{}")); }catch(e){}

const $ = id => document.getElementById(id);
const gridEl=$("grid"), statusEl=$("status");
const cells=[];
for(let i=0;i<81;i++){
  const d=document.createElement("div"); d.className="c"; d.setAttribute("role","gridcell");
  d.addEventListener("pointerdown",e=>{e.preventDefault(); select(i);});
  gridEl.appendChild(d); cells.push(d);
}
const padEl=$("pad");
for(let n=1;n<=9;n++){
  const b=document.createElement("button"); b.dataset.n=n; b.innerHTML=n+"<small></small>";
  b.addEventListener("click",()=>place(n)); padEl.appendChild(b);
}
const levelsEl=$("levels");
LEVELS.forEach((l,i)=>{
  const b=document.createElement("button"); b.className="lv"; b.textContent=l.name;
  b.addEventListener("click",()=>{ prefs.level=i; savePrefs(); renderLevels(); requestNew(); });
  levelsEl.appendChild(b);
});
// stop buttons stealing keyboard focus
document.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>e.preventDefault()));
document.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>b.blur()));

function savePrefs(){ try{localStorage.setItem(PREF_KEY,JSON.stringify(prefs));}catch(e){} }
function saveGame(){ if(!G) return; try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }catch(e){} }
function clearSave(){ try{localStorage.removeItem(SAVE_KEY);}catch(e){} }

function setStatus(t,cls){ statusEl.textContent=t||""; statusEl.className=cls||""; }
const fmt = s => ((s/60)|0)+":"+String(s%60).padStart(2,"0");

// ---------- game flow ----------
function newGame(){
  confirmNew=0; setStatus("Generating…");
  $("win").classList.remove("show");
  setTimeout(()=>{
    const {puz,sol}=generate(LEVELS[prefs.level].clues);
    G={level:prefs.level, given:puz, val:puz.slice(), sol, hint:new Array(81).fill(false),
       time:0, hints:0, moves:0, won:false};
    undoS=[]; redoS=[]; sel=puz.indexOf(0);
    setStatus(""); startTimer(); render(); saveGame();
  },20);
}
function inProgress(){ return G && !G.won && G.moves>0; }
function requestNew(){
  if(inProgress() && !confirmNew){
    confirmNew=1; setStatus("Game in progress. Press New game / N again to discard.","bad");
    clearTimeout(requestNew.t); requestNew.t=setTimeout(()=>{confirmNew=0; if(statusEl.classList.contains("bad")) setStatus("");},4000);
    return;
  }
  newGame();
}
function startTimer(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(G && !G.won && !document.hidden){ G.time++; if(G.time%5===0) saveGame(); }
    $("timer").textContent=fmt(G?G.time:0);
  },1000);
}
document.addEventListener("visibilitychange",()=>{ saveGame(); });

function select(i){ sel=Math.max(0,Math.min(80,i)); render(); }
function move(dr,dc){
  const r=(ROW(sel)+dr+9)%9, c=(COL(sel)+dc+9)%9; select(r*9+c);
}

function setVal(i,v,isHint){
  if(!G||G.won||G.given[i]) return;
  const prev=G.val[i], prevHint=G.hint[i];
  if(prev===v && !isHint) return;
  undoS.push({i,prev,prevHint,next:v,nextHint:!!isHint}); redoS=[];
  G.val[i]=v; G.hint[i]=!!isHint; G.moves++;
  afterChange(i);
}
function afterChange(i){
  render(); saveGame(); checkComplete(i);
}
function place(n){
  if(!G||G.won) return;
  if(G.given[sel]){ setStatus("That cell is a given.","bad"); return; }
  setVal(sel,n,false);
}
function erase(){ if(G&&!G.won&&!G.given[sel]) setVal(sel,0,false); }
function undo(){
  const m=undoS.pop(); if(!m||G.won) return;
  G.val[m.i]=m.prev; G.hint[m.i]=m.prevHint; redoS.push(m); sel=m.i; setStatus(""); render(); saveGame();
}
function redo(){
  const m=redoS.pop(); if(!m||G.won) return;
  G.val[m.i]=m.next; G.hint[m.i]=m.nextHint; undoS.push(m); sel=m.i; setStatus(""); render(); saveGame();
}
function hint(){
  if(!G||G.won) return;
  let i=sel;
  if(G.given[i] || G.val[i]===G.sol[i]){
    // pick a wrong cell first, else an empty one
    i=[...Array(81).keys()].find(k=>!G.given[k]&&G.val[k]&&G.val[k]!==G.sol[k]);
    if(i===undefined) i=[...Array(81).keys()].find(k=>!G.val[k]);
    if(i===undefined) return;
    sel=i;
  }
  G.hints++; setVal(i,G.sol[i],true);
  if(!G.won) setStatus("Hint used ("+G.hints+")");
}

function complete(){ return G.val.every(v=>v); }
function checkComplete(){
  if(!complete()) return;
  const wrong=G.val.some((v,i)=>v!==G.sol[i]);
  if(!wrong){ win(); return; }
  // full but wrong: reveal errors regardless of mode
  G.reveal=true; render();
  setStatus("Grid full but not correct. Wrong cells marked red.","bad");
}
function win(){
  G.won=true; clearInterval(timerId); clearSave(); render();
  setStatus("Solved in "+fmt(G.time)+"!","good");
  $("winmsg").textContent=LEVELS[G.level].name+" · "+fmt(G.time)+" · "+G.hints+" hint"+(G.hints===1?"":"s");
  $("win").classList.add("show");
  setTimeout(()=>$("again").focus(),50);
}

// ---------- render ----------
function render(){
  if(!G) return;
  const sv=G.val[sel], sr=ROW(sel), sc=COL(sel), sb=BOX(sel);
  const counts=new Array(10).fill(0);
  for(let i=0;i<81;i++){
    const v=G.val[i]; counts[v]++;
    const el=cells[i];
    let cls="c";
    if(i===sel) cls+=" sel";
    else if(sv && v===sv) cls+=" same";
    else if(ROW(i)===sr||COL(i)===sc||BOX(i)===sb) cls+=" peer";
    if(G.given[i]) cls+=" given"; else if(G.hint[i]) cls+=" hint"; else if(v) cls+=" user";
    const showErr = (prefs.instant || G.reveal) && v && !G.given[i] && !G.hint[i] && v!==G.sol[i];
    if(showErr) cls+=" err";
    el.className=cls;
    el.textContent=v||"";
  }
  padEl.querySelectorAll("button").forEach(b=>{
    const n=+b.dataset.n, left=9-counts[n];
    b.classList.toggle("done",left<=0);
    b.querySelector("small").textContent=left>0?left:"";
  });
  const m=$("mode"); m.setAttribute("aria-pressed",prefs.instant);
  m.textContent="Instant check: "+(prefs.instant?"on":"off");
  $("undo").disabled=!undoS.length; $("redo").disabled=!redoS.length;
  $("timer").textContent=fmt(G.time);
  $("undo").style.opacity=undoS.length?1:.4; $("redo").style.opacity=redoS.length?1:.4;
  if(G.reveal && !complete()) G.reveal=false;
}
function renderLevels(){
  [...levelsEl.children].forEach((b,i)=>b.setAttribute("aria-pressed",i===prefs.level));
}

// ---------- input ----------
$("mode").addEventListener("click",toggleMode);
function toggleMode(){
  prefs.instant=!prefs.instant; savePrefs(); render();
  setStatus(prefs.instant?"Wrong numbers are flagged as you place them.":"Numbers checked only when grid is full.");
}
$("new").addEventListener("click",requestNew);
$("undo").addEventListener("click",undo);
$("redo").addEventListener("click",redo);
$("hint").addEventListener("click",hint);
$("erase").addEventListener("click",erase);
$("again").addEventListener("click",newGame);

document.addEventListener("keydown",e=>{
  if($("win").classList.contains("show")){
    if(e.key==="Enter"||e.key==="n"||e.key==="N"){ e.preventDefault(); newGame(); }
    return;
  }
  const k=e.key, mod=e.ctrlKey||e.metaKey;
  if(mod){
    if(k==="z"||k==="Z"){ e.preventDefault(); e.shiftKey?redo():undo(); }
    else if(k==="y"||k==="Y"){ e.preventDefault(); redo(); }
    return;
  }
  if(e.altKey) return;
  if(k>="1"&&k<="9"){ e.preventDefault(); place(+k); return; }
  switch(k){
    case "0": case "Backspace": case "Delete": case " ": e.preventDefault(); erase(); break;
    case "ArrowUp": case "w": case "k": e.preventDefault(); move(-1,0); break;
    case "ArrowDown": case "s": case "j": e.preventDefault(); move(1,0); break;
    case "ArrowLeft": case "a": case "h": e.preventDefault(); move(0,-1); break;
    case "ArrowRight": case "d": case "l": e.preventDefault(); move(0,1); break;
    case "?": case "H": e.preventDefault(); hint(); break;
    case "c": case "C": toggleMode(); break;
    case "D": prefs.level=(prefs.level+LEVELS.length-1)%LEVELS.length; savePrefs(); renderLevels(); setStatus("Difficulty: "+LEVELS[prefs.level].name+". Press N to start."); break;
    case "n": case "N": requestNew(); break;
    case "u": case "U": undo(); break;
    case "r": case "R": redo(); break;
  }
});

// ---------- boot ----------
renderLevels();
(function boot(){
  try{
    const s=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
    if(s && s.val && s.val.length===81 && !s.won){
      G=s; sel=Math.max(0,G.val.indexOf(0)); startTimer(); render();
      setStatus("Game restored."); return;
    }
  }catch(e){}
  newGame();
})();
</script>
</body>
</html>
